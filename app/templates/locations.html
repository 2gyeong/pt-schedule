{% extends "base.html" %}
{% block title %}지점 관리{% endblock %}
{% block content %}
<h1>지점 관리</h1>
<p class="hint">카카오맵/구글맵에서 지점 위치를 우클릭하면 위도·경도 좌표를 복사할 수 있습니다.</p>

<form method="post" action="{{ url_for('locations.create_location') }}" class="member-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="text" name="name" placeholder="지점 이름 *" required>
  <input type="text" name="lat" placeholder="위도 (예: 37.5012)" required>
  <input type="text" name="lng" placeholder="경도 (예: 127.0396)" required>
  <button type="submit">등록</button>
</form>

<table class="member-table">
  <thead>
    <tr><th>이름</th><th>위도</th><th>경도</th><th>달력 색상</th><th></th></tr>
  </thead>
  <tbody>
    {% for location in locations %}
    <tr>
      <td>{{ location.name }}</td>
      <td>{{ location.lat }}</td>
      <td>{{ location.lng }}</td>
      <td>
        <form method="post" action="{{ url_for('locations.set_color', location_id=location.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="color" name="color" value="{{ location.color }}" onchange="this.form.submit()">
        </form>
      </td>
      <td>
        <form method="post" action="{{ url_for('locations.delete_location', location_id=location.id) }}"
              onsubmit="return confirm('삭제할까요?');">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="danger">삭제</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="5">등록된 지점이 없습니다.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
