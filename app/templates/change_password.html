{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<p class="hint"><a href="{{ url_for('settings.show_settings') }}">← 환경설정으로</a></p>
<h1>비밀번호 변경</h1>
<form method="post" action="{{ url_for('settings.change_password') }}" class="member-form" style="flex-direction:column; align-items:stretch; max-width:320px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>현재 비밀번호 <input type="password" name="current_password" required></label>
  <label>새 비밀번호 <input type="password" name="new_password" required></label>
  <label>새 비밀번호 확인 <input type="password" name="new_password_confirm" required></label>
  <button type="submit">변경</button>
</form>
{% endblock %}
