{% extends "base.html" %}
{% block title %}달력{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/timegrid@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.15/index.global.min.js"></script>
{% endblock %}
{% block content %}
<h1>PT 일정</h1>
<div class="legend">
  {% for location in locations %}
  <span class="legend-item"><span class="dot" style="background:{{ location.color }}"></span>{{ location.name }}</span>
  {% endfor %}
  <span class="legend-item"><span class="dot dot-pending"></span>승인 대기 (빗금)</span>
  <span class="legend-item"><span class="dot" style="border:2px dashed var(--text-muted); background:transparent;"></span>상담 (점선 테두리)</span>
  <span class="legend-item"><span class="dot" style="background:#a9d9be"></span>선택한 회원의 가능 시간</span>
</div>
<div class="member-form" style="margin-bottom:12px;">
  <label>회원 보기
    <select id="member-filter">
      <option value="">전체보기</option>
      {% for member in members %}
      <option value="{{ member.id }}">{{ member.name }}</option>
      {% endfor %}
    </select>
  </label>
</div>
<button type="button" id="new-event-btn">+ 새 일정 등록 (오늘)</button>
<div id="calendar" data-start-hour="{{ current_trainer().schedule_start_hour }}" data-end-hour="{{ current_trainer().schedule_end_hour }}"></div>
<script id="kr-holidays" type="application/json">{{ holidays | tojson }}</script>

<div id="event-modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modal-title">일정 등록</h2>
    <form id="event-form">
      <input type="hidden" id="event-id">
      <label>종류
        <select id="event-type">
          <option value="PT">PT (기본 시간)</option>
          <option value="상담">상담 (30분)</option>
        </select>
      </label>
      <label>회원
        <select id="event-member" required>
          {% for member in members %}
          <option value="{{ member.id }}">{{ member.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>지점
        <select id="event-location">
          <option value="">회원 기본 지점 사용</option>
          {% for location in locations %}
          <option value="{{ location.id }}">{{ location.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>날짜 <input type="date" id="event-date" required></label>
      <label>시작 시간 (아래에서 빠르게 선택하거나 직접 입력)</label>
      <div class="time-cubes" id="event-time-cubes"></div>
      <label>시작 시간 (세부 조정) <input type="time" id="event-start" required></label>
      <label>종료 시간 (1시간 자동, 수정 가능) <input type="time" id="event-end" required></label>
      <label>상태
        <select id="event-status">
          <option value="확정">확정</option>
          <option value="완료">완료</option>
          <option value="취소">취소</option>
        </select>
      </label>
      <label>메모 <input type="text" id="event-memo"></label>
      <div class="modal-actions" id="normal-actions">
        <button type="submit">저장</button>
        <button type="button" id="delete-btn" class="danger hidden">삭제</button>
        <button type="button" id="cancel-btn">취소</button>
      </div>
      <div class="modal-actions hidden" id="request-actions">
        <button type="button" id="approve-btn">승인</button>
        <button type="button" id="reject-btn" class="danger">거절</button>
        <button type="button" id="cancel-btn-2">닫기</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
